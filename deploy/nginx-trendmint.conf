upstream affordablenft_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream affordablenft_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Redirect all HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name affordablenft.com www.affordablenft.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://affordablenft.com$request_uri;
    }
}

# Canonical redirect for www -> apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.affordablenft.com;

    ssl_certificate /etc/letsencrypt/live/affordablenft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affordablenft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://affordablenft.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name affordablenft.com;

    ssl_certificate /etc/letsencrypt/live/affordablenft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affordablenft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://affordablenft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /generated/ {
        proxy_pass http://affordablenft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /health {
        proxy_pass http://affordablenft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://affordablenft_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
